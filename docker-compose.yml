# MariaDB만 컨테이너로 실행한다 (ARCHITECTURE §1·§3). 백엔드·프론트는 각자 PC에서 직접 실행.
# 사용: cp .env.example .env  →  docker compose up -d
# 값은 같은 폴더의 .env에서 읽는다. 비어 있으면 실행을 멈춘다.
# 폴더 이름(-Doing_It- 등)과 상관없이 같은 이름을 쓰도록 고정 (볼륨 이름: doing_it_mariadb_data)
name: doing_it

services:
  mariadb:
    image: mariadb:10.11
    container_name: doing_it_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?.env에 MARIADB_ROOT_PASSWORD를 넣어 주세요}
      MARIADB_USER: ${MARIADB_USER:?.env에 MARIADB_USER를 넣어 주세요}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?.env에 MARIADB_PASSWORD를 넣어 주세요}
    # 서버 기본 문자셋 utf8mb4 (DATABASE-DESIGN §1-7)
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # PC 쪽 포트는 3307 (수업 PC에 설치된 MariaDB가 3306을 쓰므로 겹치지 않게). 컨테이너 안은 3306 그대로
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      # 처음 만들 때(볼륨이 비어 있을 때) 한 번만 실행된다
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mariadb_data:
